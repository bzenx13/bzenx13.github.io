<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Déroulant HTML/CSS</title>
  <style>
    /* Styles de base de la barre de navigation */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }

    nav {
      background-color: #2c3e50;
    }

    /* Style de la liste principale */
    .menu {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .menu > li {
      position: relative;
    }

    /* Liens principaux */
    .menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 15px 20px;
      transition: background-color 0.3s ease;
    }

    .menu a:hover {
      background-color: #34495e;
    }

    /* Flèche pour indiquer un sous-menu */
    .has-submenu > a::after {
      content: " ▼";
      font-size: 10px;
      margin-left: 5px;
    }

    /* Masquer le sous-menu par défaut */
    .submenu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #34495e;
      list-style-type: none;
      padding: 0;
      margin: 0;
      min-width: 180px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
      z-index: 100;
    }

    /* Liens du sous-menu */
    .submenu li a {
      padding: 12px 16px;
    }

    .submenu li a:hover {
      background-color: #1abc9c;
    }

    /* Afficher le sous-menu au survol du parent */
    .has-submenu:hover .submenu {
      display: block;
    }
  </style>
</head>
<body>

  <nav>
    <ul class="menu">
      <li><a href="#accueil">Accueil</a></li>
      
      <!-- Élément avec sous-menu déroulant -->
      <li class="has-submenu">
        <a href="#services">Services</a>
        <ul class="submenu">
          <li><a href="#web">Développement Web</a></li>
          <li><a href="#design">Design Graphique</a></li>
          <li><a href="#seo">Référencement (SEO)</a></li>
        </ul>
      </li>

      <li class="has-submenu">
        <a href="#produits">Produits</a>
        <ul class="submenu">
          <li><a href="#logiciels">Logiciels</a></li>
          <li><a href="#applications">Applications Mobile</a></li>
        </ul>
      </li>

      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
