<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapport technique - Étiquette électronique</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }

    /* En-tête du rapport */
    .header {
      background-color: black;
      color: white;
      padding: 20px;
    }

    .header h1 {
      margin: 0;
    }

    /* Styles de la barre de navigation */
    nav {
      background-color: #2c3e50;
    }

    .menu {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .menu > li {
      position: relative;
    }

    .menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 15px 20px;
      transition: background-color 0.3s ease;
    }

    .menu a:hover {
      background-color: #34495e;
    }

    /* Indice flèche pour les sous-menus */
    .has-submenu > a::after {
      content: " ▼";
      font-size: 10px;
      margin-left: 5px;
    }

    /* Masquer le sous-menu par défaut */
    .submenu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #34495e;
      list-style-type: none;
      padding: 0;
      margin: 0;
      min-width: 320px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
      z-index: 100;
    }

    .submenu li {
      padding: 12px 16px;
      color: #ecf0f1;
      border-bottom: 1px solid #2c3e50;
      font-size: 14px;
      line-height: 1.4;
    }

    .submenu li:last-child {
      border-bottom: none;
    }

    .submenu ul {
      margin: 5px 0 0 15px;
      padding: 0;
      list-style-type: disc;
    }

    .submenu ul li {
      padding: 4px 0;
      border-bottom: none;
    }
